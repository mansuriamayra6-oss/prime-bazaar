    <script>
      (function () {
        try {
          var origin = window.location.origin;
          if (!origin || origin === 'null') return;
          var canonical = document.querySelector('link[rel="canonical"]');
          if (canonical) canonical.setAttribute('href', origin + window.location.pathname);
          var ogUrl = document.querySelector('meta[property="og:url"]');
          if (ogUrl) ogUrl.setAttribute('content', origin + window.location.pathname);
          var logoUrl = origin + '/pwa-512x512.png?v=4';
          ['meta[property="og:image"]', 'meta[property="og:image:secure_url"]', 'meta[name="twitter:image"]'].forEach(function (sel) {
            var el = document.querySelector(sel);
            if (el) el.setAttribute('content', logoUrl);
          });
          var ld = document.getElementById('pb-schema-ld');
          if (ld && ld.textContent) {
            var data = JSON.parse(ld.textContent);
            if (Array.isArray(data['@graph'])) {
              data['@graph'].forEach(function (node) {
                node.url = origin + '/';
                if (node.logo && typeof node.logo === 'object') node.logo.url = logoUrl;
                if (node.image) node.image = logoUrl;
              });
              ld.textContent = JSON.stringify(data);
            }
          }
        } catch (e) {}
      })();
    </script>
